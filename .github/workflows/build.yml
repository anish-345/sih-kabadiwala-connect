name: Build & Test Kabadiwala Connect (SIH 2026)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

jobs:
  build-and-test:
    name: Test & Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kabadiwala_connect

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('kabadiwala_connect/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Gradle Cache Acceleration
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-root-directory: kabadiwala_connect/android

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite (16 Core Specs)
        run: flutter test

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_mode == 'debug' || github.event.inputs.build_mode == 'all' || github.event_name != 'workflow_dispatch' }}
        run: flutter build apk --debug

      - name: Build Release APK
        if: ${{ github.event.inputs.build_mode == 'release' || github.event.inputs.build_mode == 'all' }}
        run: flutter build apk --release

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_mode == 'debug' || github.event.inputs.build_mode == 'all' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: kabadiwala-connect-debug-apk
          path: kabadiwala_connect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_mode == 'release' || github.event.inputs.build_mode == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: kabadiwala-connect-release-apk
          path: kabadiwala_connect/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
