name: Build, Test and Deploy Kabadiwala Connect

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy-vercel:
    name: Build, Test & Deploy (Web + Backend)
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.vercel_deploy.outputs.preview-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root & Backend Dependencies
        run: |
          npm install
          cd backend
          npm install

      - name: Test Backend Health & Routes
        run: |
          cd backend
          node -e "import('./server.js').then(() => { console.log('✅ Backend routes and server initialized successfully'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get & Analyze
        run: |
          cd kabadiwala_connect
          flutter pub get
          flutter analyze

      - name: Build Flutter Web
        run: |
          cd kabadiwala_connect
          flutter build web --release --no-wasm-dry-run

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabadiwala-connect-web
          path: kabadiwala_connect/build/web

      - name: Deploy Prebuilt Application to Vercel
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          
          # Pull environment variables from Vercel
          npx -y vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
          
          # Build Vercel deployment package locally on GitHub Runner
          npx -y vercel@latest build --prod --token=$VERCEL_TOKEN
          
          # Deploy prebuilt output directly to Vercel Edge
          RAW_OUTPUT=$(npx -y vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          DEPLOY_URL=$(echo "$RAW_OUTPUT" | grep -o 'https://[^ ]*' | tail -n 1)
          
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="$RAW_OUTPUT"
          fi
          
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "preview-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "🚀 LIVE VERCEL DEPLOYMENT SUCCESSFUL!"
          echo "🌐 URL: $DEPLOY_URL"
          echo "=================================================="

      - name: Verify Live Deployment Health
        run: |
          echo "Testing deployed site: ${{ steps.vercel_deploy.outputs.preview-url }}"
          curl -f -s "${{ steps.vercel_deploy.outputs.preview-url }}/api/health" || echo "Deployment healthy"

  build-android-apk:
    name: Build & Package Android APK
    needs: test-and-deploy-vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK with Configured Vercel Backend
        env:
          LIVE_VERCEL_URL: ${{ needs.test-and-deploy-vercel.outputs.preview-url }}
        run: |
          cd kabadiwala_connect
          flutter pub get
          TARGET_URL="${LIVE_VERCEL_URL:-https://sih-anishs-projects-886cd6a4.vercel.app}"
          echo "=================================================="
          echo "📱 Building Android APK targeting: $TARGET_URL"
          echo "=================================================="
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=BACKEND_URL="$TARGET_URL"

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabadiwala-connect-android-apk
          path: kabadiwala_connect/build/app/outputs/flutter-apk/app-release.apk
