name: kabadiwala_connect
description: "Kabadiwala Connect – SIH 2026 PS26229 – Informal E-Waste Collector Platform"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.2.7

  # ── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Local database (Drift / SQLite) ─────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Shared preferences ──────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Networking & connectivity ───────────────────────────────
  connectivity_plus: ^6.1.0

  # ── QR code generation & scanning ───────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ── Image handling ──────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Audio / TTS (vernacular voice output) ───────────────────
  flutter_tts: ^4.2.2

  # ── UI components & charts ──────────────────────────────────
  fl_chart: ^0.68.0

  # ── PDF generation (handover receipt) ───────────────────────
  pdf: ^3.11.0
  printing: ^5.13.1

  # ── Utilities ────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.5
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/models/
    - assets/images/
    - assets/images/benchmark/
    - assets/images/test_samples/
